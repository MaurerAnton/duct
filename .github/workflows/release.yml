name: release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      matrix:
        include:
          # --- musl static ---
          - target: x86_64-linux-musl
            name: duct-x86_64
            static: true
          - target: x86-linux-musl
            name: duct-i386
            static: true
          - target: aarch64-linux-musl
            name: duct-aarch64
            static: true
          - target: arm-linux-musleabihf
            name: duct-armhf
            static: true
          - target: arm-linux-musleabi
            name: duct-arm
            static: true
          - target: riscv64-linux-musl
            name: duct-riscv64
            static: true
          - target: mipsel-linux-musl
            name: duct-mipsel
            static: true
          - target: mips-linux-musl
            name: duct-mips
            static: true
          - target: mips64-linux-musl
            name: duct-mips64
            static: true
          - target: mips64el-linux-musl
            name: duct-mips64el
            static: true
          - target: powerpc64-linux-musl
            name: duct-ppc64
            static: true
          - target: powerpc-linux-musl
            name: duct-ppc
            static: true
          - target: powerpc64le-linux-musl
            name: duct-ppc64le
            static: true

          # --- glibc dynamic ---
          - target: x86_64-linux-gnu
            name: duct-x86_64-glibc
            static: false
          - target: x86-linux-gnu
            name: duct-i386-glibc
            static: false
          - target: aarch64-linux-gnu
            name: duct-aarch64-glibc
            static: false
          - target: arm-linux-gnueabihf
            name: duct-armhf-glibc
            static: false
          - target: arm-linux-gnueabi
            name: duct-arm-glibc
            static: false
          - target: mipsel-linux-gnueabihf
            name: duct-mipsel-glibc
            static: false
          - target: mips-linux-gnueabihf
            name: duct-mips-glibc
            static: false
          - target: powerpc64-linux-gnu
            name: duct-ppc64-glibc
            static: false
          - target: powerpc64le-linux-gnu
            name: duct-ppc64le-glibc
            static: false

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.13.0
      - run: |
          flags="-target ${{ matrix.target }} -O2 -s"
          ${{ matrix.static }} && flags="$flags -static"
          zig cc $flags -o ${{ matrix.name }} duct.c
          strip ${{ matrix.name }} || true
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: binaries
          merge-multiple: true
      - run: |
          cd binaries
          sha256sum * > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: binaries/*
          generate_release_notes: true
